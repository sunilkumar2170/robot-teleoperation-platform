services:
  teleop-sim:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: teleop-sim-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/teleop_sim.db
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - WATCHDOG_TIMEOUT_SECONDS=2.0
      - SIMULATION_FREQUENCY_HZ=20
    volumes:
      - teleop-data:/app/data
      - teleop-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  teleop-data:
    driver: local
  teleop-logs:
    driver: local
